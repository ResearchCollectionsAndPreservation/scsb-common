buildscript {
    ext {
        springBootVersion = '4.0.7'
        set('springCloudVersion', "2025.1.2")
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
    }
}

plugins {
    id 'org.springframework.boot' version '4.0.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "6.3.1.5724"
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'org.springframework.boot'
apply plugin: 'jacoco'

//added to accept systemproperties while executing gradlew test cmd
test {
    systemProperties = System.properties
}

jar {
    enabled = true
    archiveBaseName = 'scsb-common'
    archiveVersion = System.properties["archiveVersion"]
}

group = 'org.recap'
version = '3.2'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web-services'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    implementation 'commons-beanutils:commons-beanutils:1.11.0'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'io.springfox:springfox-swagger-ui:3.0.0'
    implementation 'io.springfox:springfox-swagger2:3.0.0'
    implementation 'org.codehaus.jettison:jettison:1.5.7'
    implementation 'org.apache.camel:camel-bindy:4.18.4'
    implementation 'org.apache.camel:camel-mail:4.18.4'
    implementation 'org.apache.camel:camel-ftp:4.18.4'
    implementation 'org.apache.camel:camel-zipfile:4.18.4'
    implementation 'org.apache.camel:camel-activemq:4.18.4'
    implementation 'org.apache.activemq:activemq-pool:6.2.0'
    implementation 'org.apache.activemq:activemq-broker:6.2.0'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.projectlombok:lombok:1.18.46'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.json:json:20260719'
    implementation 'com.google.code.gson:gson:2.14.0'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
    testImplementation 'org.projectlombok:lombok:1.18.46'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.46'
    testImplementation "org.springframework.boot:spring-boot-starter-test:4.0.7"

    implementation 'com.mysql:mysql-connector-j:9.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'


}
configurations.all {
    resolutionStrategy.eachDependency { DependencyResolveDetails details ->
        if (details.requested.group == 'org.apache.logging.log4j') {
            details.useVersion '2.26.1'
        }
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

jacocoTestReport {
    group = "Reporting"
    reports {
        xml.required = true
        csv.required = false
        html.required = true
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
}

task scsbCommonJavadocs(type: Javadoc) {
    source = sourceSets.main.java
    classpath = configurations.implementation
    options.addStringOption('Xdoclint:none', '-quiet')
    String home = System.getProperty("user.home");
    destinationDir = new File(home+"/scsb-javadocs/scsb-common");

}
jar {
    enabled = true
    archiveClassifier = '' //use empty string
}
tasks.named('bootJar') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}